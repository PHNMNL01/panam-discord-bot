<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panam Web</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='panam.css') }}">
</head>
<body>
  <main class="panam-web-shell">
    <aside class="panam-web-rail" aria-label="Budouci navigace Panam">
      <a class="rail-home-mark" href="{{ url_for('index') }}" aria-label="Zpet na hlavni stranku Panam">
        <span class="panam-home-fallback" aria-hidden="true">P</span>
        <img src="{{ url_for('static', filename='panam_avatar.png') }}" alt="" onerror="this.remove();">
      </a>
      <span class="rail-placeholder-dot" aria-hidden="true"></span>
      <span class="rail-placeholder-dot" aria-hidden="true"></span>
    </aside>

    <section class="panam-web-main">
      <section class="hero">
        <div class="page-title-brand">
          <a class="panam-home-mark" href="{{ url_for('index') }}" aria-label="Zpet na hlavni stranku Panam">
            <span class="panam-home-fallback" aria-hidden="true">P</span>
            <img src="{{ url_for('static', filename='panam_avatar.png') }}" alt="" onerror="this.remove();">
          </a>
          <div>
            <p class="eyebrow">Panam adapter preview</p>
            <h1>Panam Web</h1>
            <p class="intro">
              Základní webový chat nad Panam core. Ve webu už nemusíš psát „Panam“ před každý příkaz.
            </p>
          </div>
        </div>
        <div class="hero-actions">
          <div class="panam-status-badge" aria-label="Panam status">
            <span class="panam-status-avatar" aria-hidden="true">P</span>
            <span class="panam-status-text">
              <span class="panam-status-name">Panam</span>
              <span class="panam-status-detail">web adapter online</span>
            </span>
          </div>
          <button id="clear-chat" class="clear-button" type="button">Vyčistit chat</button>
        </div>
      </section>

      <div class="panam-web-workspace">
        <section class="chat-panel panam-chat-panel" aria-label="Panam chat">
          <div id="chat-log" class="chat-log" aria-live="polite"></div>

          <form id="chat-form" class="composer">
            <label for="message" class="sr-only">Zpráva pro Panam</label>
            <textarea
              id="message"
              name="message"
              rows="3"
              placeholder="Napiš zprávu pro Panam..."
              autocomplete="off"
            ></textarea>
            <button type="submit">Odeslat</button>
          </form>

          <div class="examples" aria-label="Příklady příkazů">
            <span>Příklady:</span>
            <button type="button">Jak se máš?</button>
            <button type="button">Shrň mi tento text...</button>
            <button type="button">Přidej todo dodělat web UI</button>
            <button type="button">Ukaž todo</button>
            <button type="button">Přidej poznámku Panam web v1 funguje</button>
            <button type="button">Ukaž poznámky</button>
          </div>
        </section>

        <section class="file-panel panam-file-panel" aria-label="Panam souborova dilna">
          <div class="file-panel-header">
            <div>
              <p class="eyebrow">Souborova dilna</p>
              <h2>Souborova dilna</h2>
            </div>
          </div>

          <form id="file-form" class="file-form" enctype="multipart/form-data">
            <div class="field">
              <label for="file-input">Soubor</label>
              <input
                id="file-input"
                name="file"
                type="file"
                accept=".txt,.md,.csv,.json,.pdf,.docx,.xlsx"
                required
              >
            </div>

            <div class="field">
              <label for="file-instruction">Instrukce</label>
              <textarea
                id="file-instruction"
                name="instruction"
                rows="3"
                placeholder="Napr. vyber sloupce Oddeleni"
              ></textarea>
            </div>

            <div class="file-controls">
              <div class="field">
                <label for="output-format">Vystup</label>
                <select id="output-format" name="output_format">
                  <option value="auto">auto</option>
                  <option value="chat">chat</option>
                  <option value="md">md</option>
                  <option value="txt">txt</option>
                  <option value="docx">docx</option>
                  <option value="xlsx">xlsx</option>
                  <option value="csv">csv</option>
                  <option value="json">json</option>
                </select>
              </div>
              <button id="file-submit" type="submit">Zpracovat</button>
            </div>
          </form>

          <div class="file-actions" aria-label="Rychle souborove akce">
            <button type="button">Vyber sloupce Oddeleni</button>
            <button type="button">Odstran prazdne radky</button>
            <button type="button">Udelej report</button>
            <button type="button">Vytahni data do JSONu</button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const chatForm = document.querySelector("#chat-form");
    const fileForm = document.querySelector("#file-form");
    const chatLog = document.querySelector("#chat-log");
    const messageInput = document.querySelector("#message");
    const fileInput = document.querySelector("#file-input");
    const fileInstruction = document.querySelector("#file-instruction");
    const fileSubmit = document.querySelector("#file-submit");
    const clearButton = document.querySelector("#clear-chat");
    const exampleButtons = document.querySelectorAll(".examples button");
    const fileActionButtons = document.querySelectorAll(".file-actions button");

    const welcomeText = "Jsem online ve web režimu. Zkus třeba „help“ nebo „ukaž todo“. ";

    function createAvatar() {
      const avatar = document.createElement("div");
      avatar.className = "avatar";

      const fallback = document.createElement("span");
      fallback.textContent = "P";

      const image = document.createElement("img");
      image.src = "/static/panam_avatar.png";
      image.alt = "";
      image.onerror = () => {
        image.remove();
        avatar.classList.add("avatar-fallback");
      };

      avatar.append(fallback, image);
      return avatar;
    }

    function appendMessage(role, text, options = {}) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const message = document.createElement("div");
      message.className = `message ${role}`;
      if (options.loading) {
        message.classList.add("loading");
      }

      const name = document.createElement("div");
      name.className = "message-name";
      name.textContent = role === "user" ? "Ty" : "Panam";

      const body = document.createElement("div");
      body.className = "message-text";
      body.textContent = text;

      message.append(name, body);

      if (options.downloadUrl) {
        const link = document.createElement("a");
        link.className = "download-link";
        link.href = options.downloadUrl;
        link.textContent = options.downloadName || "Stahnout vystup";
        link.download = options.downloadName || "";
        message.append(link);
      }

      if (role === "panam") {
        row.append(createAvatar(), message);
      } else {
        row.append(message);
      }

      chatLog.append(row);
      chatLog.scrollTop = chatLog.scrollHeight;
      return row;
    }

    function resetChatLog() {
      chatLog.replaceChildren();
      appendMessage("panam", welcomeText);
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) {
        return;
      }

      appendMessage("user", message);
      messageInput.value = "";
      messageInput.focus();

      const loadingMessage = appendMessage("panam", "Panam přemýšlí...", { loading: true });

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await response.json();
        loadingMessage.remove();
        appendMessage("panam", data.answer || data.error || "Panam nevrátila odpověď.");
      } catch (error) {
        loadingMessage.remove();
        appendMessage("panam", "Spojení s Panam web adapterem selhalo.");
      }
    }

    async function sendFileRequest() {
      if (!fileInput.files.length) {
        appendMessage("panam", "Vyber prosim soubor.");
        return;
      }

      const formData = new FormData(fileForm);
      const filename = fileInput.files[0].name;
      appendMessage("user", `Soubor: ${filename}\n${fileInstruction.value.trim() || "auto"}`);

      fileSubmit.disabled = true;
      const loadingMessage = appendMessage("panam", "Panam zpracovava soubor...", { loading: true });

      try {
        const response = await fetch("/api/files/process", {
          method: "POST",
          body: formData,
        });
        const data = await response.json();
        loadingMessage.remove();

        if (!response.ok || data.error) {
          appendMessage("panam", data.error || "Soubor se nepodarilo zpracovat.");
          return;
        }

        if (data.kind === "file") {
          appendMessage("panam", data.message || "Soubor je hotovy.", {
            downloadUrl: data.download_url,
            downloadName: data.output_filename,
          });
          return;
        }

        appendMessage("panam", data.answer || data.message || "Panam nevratila odpoved.");
      } catch (error) {
        loadingMessage.remove();
        appendMessage("panam", "Spojeni se souborovou dilnou selhalo.");
      } finally {
        fileSubmit.disabled = false;
      }
    }

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });

    fileForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendFileRequest();
    });

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.ctrlKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    clearButton.addEventListener("click", async () => {
      clearButton.disabled = true;
      try {
        await fetch("/api/clear", { method: "POST" });
        resetChatLog();
      } catch (error) {
        appendMessage("panam", "Chat se nepodařilo vyčistit.");
      } finally {
        clearButton.disabled = false;
        messageInput.focus();
      }
    });

    exampleButtons.forEach((button) => {
      button.addEventListener("click", () => {
        messageInput.value = button.textContent;
        messageInput.focus();
      });
    });

    fileActionButtons.forEach((button) => {
      button.addEventListener("click", () => {
        fileInstruction.value = button.textContent;
        fileInstruction.focus();
      });
    });

    resetChatLog();
  </script>
</body>
</html>
