<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panam Web</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='panam.css') }}">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Panam adapter preview</p>
        <h1>Panam Web</h1>
        <p class="intro">
          Základní webový chat nad Panam core. Ve webu už nemusíš psát „Panam“ před každý příkaz.
        </p>
      </div>
      <button id="clear-chat" class="clear-button" type="button">Vyčistit chat</button>
    </section>

    <section class="chat-panel" aria-label="Panam chat">
      <div id="chat-log" class="chat-log" aria-live="polite"></div>

      <form id="chat-form" class="composer">
        <label for="message" class="sr-only">Zpráva pro Panam</label>
        <textarea
          id="message"
          name="message"
          rows="3"
          placeholder="Napiš zprávu pro Panam..."
          autocomplete="off"
        ></textarea>
        <button type="submit">Odeslat</button>
      </form>

      <div class="examples" aria-label="Příklady příkazů">
        <span>Příklady:</span>
        <button type="button">Jak se máš?</button>
        <button type="button">Shrň mi tento text...</button>
        <button type="button">Přidej todo dodělat web UI</button>
        <button type="button">Ukaž todo</button>
        <button type="button">Přidej poznámku Panam web v1 funguje</button>
        <button type="button">Ukaž poznámky</button>
      </div>
    </section>
  </main>

  <script>
    const chatForm = document.querySelector("#chat-form");
    const chatLog = document.querySelector("#chat-log");
    const messageInput = document.querySelector("#message");
    const clearButton = document.querySelector("#clear-chat");
    const exampleButtons = document.querySelectorAll(".examples button");

    const welcomeText = "Jsem online ve web režimu. Zkus třeba „help“ nebo „ukaž todo“. ";

    function createAvatar() {
      const avatar = document.createElement("div");
      avatar.className = "avatar";

      const fallback = document.createElement("span");
      fallback.textContent = "P";

      const image = document.createElement("img");
      image.src = "/static/panam_avatar.png";
      image.alt = "";
      image.onerror = () => {
        image.remove();
        avatar.classList.add("avatar-fallback");
      };

      avatar.append(fallback, image);
      return avatar;
    }

    function appendMessage(role, text, options = {}) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const message = document.createElement("div");
      message.className = `message ${role}`;
      if (options.loading) {
        message.classList.add("loading");
      }

      const name = document.createElement("div");
      name.className = "message-name";
      name.textContent = role === "user" ? "Ty" : "Panam";

      const body = document.createElement("div");
      body.className = "message-text";
      body.textContent = text;

      message.append(name, body);

      if (role === "panam") {
        row.append(createAvatar(), message);
      } else {
        row.append(message);
      }

      chatLog.append(row);
      chatLog.scrollTop = chatLog.scrollHeight;
      return row;
    }

    function resetChatLog() {
      chatLog.replaceChildren();
      appendMessage("panam", welcomeText);
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) {
        return;
      }

      appendMessage("user", message);
      messageInput.value = "";
      messageInput.focus();

      const loadingMessage = appendMessage("panam", "Panam přemýšlí...", { loading: true });

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await response.json();
        loadingMessage.remove();
        appendMessage("panam", data.answer || data.error || "Panam nevrátila odpověď.");
      } catch (error) {
        loadingMessage.remove();
        appendMessage("panam", "Spojení s Panam web adapterem selhalo.");
      }
    }

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.ctrlKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    clearButton.addEventListener("click", async () => {
      clearButton.disabled = true;
      try {
        await fetch("/api/clear", { method: "POST" });
        resetChatLog();
      } catch (error) {
        appendMessage("panam", "Chat se nepodařilo vyčistit.");
      } finally {
        clearButton.disabled = false;
        messageInput.focus();
      }
    });

    exampleButtons.forEach((button) => {
      button.addEventListener("click", () => {
        messageInput.value = button.textContent;
        messageInput.focus();
      });
    });

    resetChatLog();
  </script>
</body>
</html>
